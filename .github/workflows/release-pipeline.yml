on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      disable_old_code_protection:
        description: "Disable protections against deploying old code"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  GITHUB_SHA: ${{ github.sha }}
  SLACK_NOTIFICATION_APPLICATION_NAME: "GC Sign-In Migration Application"

name: Legacy release pipeline - prod

concurrency:
  group: migration-legacy-deploy

jobs:
  verify-current-main-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow SHA is current main
        if: inputs.disable_old_code_protection != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')

          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "This workflow is running at $GITHUB_SHA, but main is now at $MAIN_SHA."
            echo "Re-run from current main, or manually dispatch with old-code protection disabled."
            exit 1
          fi

  notify-slack-about-deploy:
    needs: [verify-current-main-sha]
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.check-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      - name: Check what environments are being deployed to
        id: check-envs
        if: github.event_name != 'workflow_dispatch'
        run: |
          ENVS_TO_DEPLOY=""
          for file in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}); do
            if [[ "$file" == ".deployed_versions/prod.json" ]]; then
              ENV_NAME=$(basename "$file" .json)
              if [ -z "$ENVS_TO_DEPLOY" ]; then
                ENVS_TO_DEPLOY="$ENV_NAME"
              else
                ENVS_TO_DEPLOY="$ENVS_TO_DEPLOY,$ENV_NAME"
              fi
            fi
          done
          echo "Found environments to deploy: $ENVS_TO_DEPLOY"
          echo "envs=$ENVS_TO_DEPLOY" >> $GITHUB_OUTPUT

      - name: Notify slack
        if: steps.check-envs.outputs.envs != ''
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":hourglass: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' is being deployed to the following environments: `'"${{ steps.check-envs.outputs.envs }}"'`\n\n<'"$workflow_url"'|Click for more details>"}'

          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_OPS_SLACK_INFO_WEBHOOK }}

  # Builds the frontend application for the current SHA and stores the artifact in S3.
  build-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [prod]
    environment: ${{ matrix.environment }}
    needs: notify-slack-about-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/github_action_push_S3-migration-app
          role-session-name: GHPushAppS3
          aws-region: ${{ env.AWS_REGION }}

      - name: Environment Variables for build
        run: |
          echo "VITE_BACKEND_API_URL=${{ vars.VITE_BACKEND_API_URL }}" >> $GITHUB_ENV
          echo "VITE_GOOGLE_ANALYTICS_ID=${{ vars.VITE_GOOGLE_ANALYTICS_ID }}" >> $GITHUB_ENV

      - name: Build application
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts to S3
        run: |
          aws s3 sync frontend/dist s3://${{ vars.FRONTEND_APP_BUILD_ARTIFACTS_S3_BUCKET }}/${GITHUB_SHA}

  # Deploys frontend application to necessary environments.
  # We check the current SHA deployed to the environment to only deploy if necessary.
  deploy-frontends:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [prod]
    environment: ${{ matrix.environment }}
    steps:
      - run: echo "Deploying frontend to ${{ matrix.environment }} environment..."

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Set deployment SHA
        run: |
          DEPLOYMENT_TAG=$(cat .deployed_versions/${{ matrix.environment }}.json | jq -r '.version')
          DEPLOYMENT_SHA=$(git rev-list -n 1 "v$DEPLOYMENT_TAG")
          echo "DEPLOYMENT_SHA=${DEPLOYMENT_SHA}" >> "$GITHUB_ENV"

      - name: Output deployment SHA
        run: echo "Deployment SHA is ${DEPLOYMENT_SHA}"

      - name: Ensure deployment SHA is set
        run: |
          if [ -z "${DEPLOYMENT_SHA}" ]; then
            echo "DEPLOYMENT_SHA is not set. Exiting."
            exit 1
          fi

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/github_action_push_S3-migration-app
          role-session-name: GHPushAppS3
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure deployment build exists
        run: |
          if ! aws s3 ls s3://${{ vars.FRONTEND_APP_BUILD_ARTIFACTS_S3_BUCKET }}/${DEPLOYMENT_SHA}/ ; then
            echo "No build artifacts found for SHA ${DEPLOYMENT_SHA} in bucket ${{ vars.FRONTEND_APP_BUILD_ARTIFACTS_S3_BUCKET }}. Exiting."
            exit 1
          fi

      - name: Deploy build to app bucket
        run: |
          aws s3 sync \
            s3://${{ vars.FRONTEND_APP_BUILD_ARTIFACTS_S3_BUCKET }}/$DEPLOYMENT_SHA \
            s3://${{ vars.FRONTEND_APP_S3_BUCKET }}

      - name: Invalidate FRONTEND_APP_CLOUDFRONT_DISTRIBUTION cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.FRONTEND_APP_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/index.html"

  # Deploys backend application to necessary environments.
  # We check the current SHA deployed to the environment to only deploy if necessary.
  deploy-backends:
    needs: [verify-current-main-sha]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [prod]
    environment: ${{ matrix.environment }}
    steps:
      - run: echo "Deploying backend to ${{ matrix.environment }} environment..."

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Set deployment SHA
        run: |
          DEPLOYMENT_TAG=$(cat .deployed_versions/${{ matrix.environment }}.json | jq -r '.version')
          DEPLOYMENT_SHA=$(git rev-list -n 1 "v$DEPLOYMENT_TAG")
          echo "DEPLOYMENT_SHA=${DEPLOYMENT_SHA}" >> "$GITHUB_ENV"

      - name: Output deployment SHA
        run: echo "Deployment SHA is ${DEPLOYMENT_SHA}"

      - name: Ensure deployment SHA is set
        run: |
          if [ -z "${DEPLOYMENT_SHA}" ]; then
            echo "DEPLOYMENT_SHA is not set. Exiting."
            exit 1
          fi

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github_action_manage_push_ecr_ecs-migration-app
          role-session-name: ECRPush
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify replicated backend image exists
        env:
          ECR_REPOSITORY: ${{ vars.ARTIFACT_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          repository="${ECR_REPOSITORY#*/}"
          image_digest=$(aws ecr describe-images \
            --repository-name "$repository" \
            --image-ids "imageTag=$DEPLOYMENT_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [[ -z "$image_digest" || "$image_digest" == "None" ]]; then
            echo "::error::No replicated backend image found for $ECR_REPOSITORY:$DEPLOYMENT_SHA"
            exit 1
          fi
          echo "Deployment image is $ECR_REPOSITORY:$DEPLOYMENT_SHA ($image_digest)."

      - name: Get current service definition
        id: current-service-def
        run: |
          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --query "services[0].taskDefinition" \
            --output text)

          echo "CURRENT_TASK_DEF_ARN=$CURRENT_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Get current image
        id: current-image
        run: |
          CURRENT_IMAGE=$(aws ecs describe-task-definition \
            --task-definition ${{ env.CURRENT_TASK_DEF_ARN }} \
            --query "taskDefinition.containerDefinitions[?name=='${{ vars.ECS_SERVICE }}'].image" \
            --output text)

          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> $GITHUB_ENV
          echo "Current image is $CURRENT_IMAGE"

      - name: Check if deployment is needed
        id: check-deployment-needed
        run: |
          if [ "$CURRENT_IMAGE" = "${{ vars.ARTIFACT_ECR_REPOSITORY }}:${{ env.DEPLOYMENT_SHA }}" ]; then
            echo "Current image is the same as deployment image. No deployment needed."
            echo "deployment_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Deployment needed."
            echo "deployment_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Download ECS task definition
        if: steps.check-deployment-needed.outputs.deployment_needed == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_SERVICE }} \
            --query taskDefinition > task-definition.json

      - name: Update ECS task image
        if: steps.check-deployment-needed.outputs.deployment_needed == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_SERVICE }}
          image: ${{ vars.ARTIFACT_ECR_REPOSITORY }}:${{ env.DEPLOYMENT_SHA }}

      - name: Deploy updated ECS task
        if: steps.check-deployment-needed.outputs.deployment_needed == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          propagate-tags: SERVICE

      - name: Update SSM parameter for deployed image
        run: |
          aws ssm put-parameter \
            --name "/ecs/${{ vars.ECS_CLUSTER }}/${{ vars.ECS_SERVICE }}/container-image" \
            --value "${{ vars.ARTIFACT_ECR_REPOSITORY }}:${{ env.DEPLOYMENT_SHA }}" \
            --type "String" \
            --overwrite

  notify-slack-about-deploy-success:
    runs-on: ubuntu-latest
    needs: [notify-slack-about-deploy, deploy-frontends, deploy-backends]
    if: success() && needs.notify-slack-about-deploy.outputs.envs != ''
    steps:
      - name: Notify slack about successful Deployments
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":white_check_mark: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' has been successfully deployed to the following environments: `'"${{ needs.notify-slack-about-deploy.outputs.envs }}"'`!\n\n<'"$workflow_url"'|Click for more details>"}'

          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_OPS_SLACK_INFO_WEBHOOK }}

  notify-slack-about-deploy-failure:
    runs-on: ubuntu-latest
    needs: [notify-slack-about-deploy, deploy-frontends, deploy-backends]
    if: failure() && needs.notify-slack-about-deploy.outputs.envs != ''
    steps:
      - name: Notify slack about failed Deployments
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":x: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' FAILED to deploy to the following environments: `'"${{ needs.notify-slack-about-deploy.outputs.envs }}"'`!\n\n<'"$workflow_url"'|Click for more details>"}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_OPS_SLACK_ALERT_WEBHOOK }}
